{% extends "base.html" %}

{% block title %}Login | InsurePredict{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    <i class="bi bi-shield-lock"></i>
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to access your insurance prediction dashboard.
                </p>

            </div>


            <form action="/login" method="POST" class="auth-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <button type="submit" class="btn btn-primary auth-button">

                    <span>Login</span>

                    <i class="bi bi-arrow-right"></i>

                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?

                    <a href="/register">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </div>

</section>

{% endblock %}
